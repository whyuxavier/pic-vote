<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Голосування за аватарки 🎃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4b4659; --muted:#8c869a; --card:rgba(255,255,255,.72); --line:#ebe5f1;
  --star:#e9b75f; --star-off:#d9d3e3; --lav:#cfc3e6; --peach:#f6d9c4; --mint:#cfe6e3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5;
  background:
    radial-gradient(900px 500px at 10% -10%, #fbe9dc 0%, transparent 60%),
    radial-gradient(800px 500px at 100% 0%, #e9e2f6 0%, transparent 60%),
    radial-gradient(900px 600px at 50% 110%, #dcecea 0%, transparent 60%),
    #faf6f8;
  background-attachment:fixed;
}
.wrap{max-width:1040px; margin:0 auto; padding:32px 18px 80px}
header{text-align:center; margin-bottom:22px}
h1{font-size:clamp(1.7rem,5vw,2.5rem); font-weight:800; margin:0 0 6px; letter-spacing:-.01em}
header p{margin:0 auto; max-width:520px; color:var(--muted)}

.bar{
  position:sticky; top:10px; z-index:5; display:flex; flex-wrap:wrap; gap:10px 16px;
  align-items:center; justify-content:space-between;
  background:rgba(255,255,255,.82); backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:18px; padding:10px 16px; margin:0 0 22px;
}
.left{display:flex; align-items:center; gap:10px; font-weight:600}
.dots{display:flex; gap:5px}
.dot{width:14px; height:14px; border-radius:50%; background:var(--star-off); transition:background .25s}
.dot.on{background:var(--star)}
.leader{font-size:.95rem; color:var(--muted)}
.leader b{color:var(--ink)}
button{font:inherit; color:inherit; cursor:pointer}
.sort{border:1px solid var(--line); background:#fff; border-radius:12px; padding:6px 12px; font-size:.9rem}
.sort:hover{background:#faf7fd}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:18px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:22px; overflow:hidden;
  display:flex; flex-direction:column; transition:box-shadow .2s, border-color .2s;
}
.card.mine{border-color:#e7cf9f; box-shadow:0 6px 22px rgba(233,183,95,.22)}
.pic{aspect-ratio:1/1; background:linear-gradient(135deg,var(--peach),var(--lav),var(--mint)); cursor:zoom-in}
.pic img{width:100%; height:100%; object-fit:cover; display:block}
.row{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; gap:8px}
.name{font-weight:800}
.count{color:var(--muted); font-size:.92rem}
.star{
  border:0; background:#faf7fd; border-radius:14px; padding:8px 12px; font-size:1.05rem;
  display:flex; align-items:center; gap:6px; color:var(--star-off); transition:transform .15s, background .2s, color .2s;
}
.star:hover{background:#f3edf9}
.star:active{transform:scale(.92)}
.star.on{background:#fbf0d9; color:var(--star)}
.star span{font-size:.9rem; color:var(--ink); font-weight:600}
.crown{font-size:.95rem; margin-left:6px}

.msg{text-align:center; color:var(--muted); padding:40px 0}
.demo{
  background:#fbf3df; border:1px solid #ecd9ab; border-radius:14px; padding:8px 14px;
  font-size:.88rem; text-align:center; margin:0 0 16px;
}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,30px); opacity:0; pointer-events:none;
  background:#4b4659; color:#fff; padding:10px 18px; border-radius:14px; font-size:.95rem;
  transition:opacity .25s, transform .25s; max-width:90vw; text-align:center; z-index:20;
}
.toast.show{opacity:1; transform:translate(-50%,0)}
.lb{
  position:fixed; inset:0; background:rgba(60,52,78,.55); display:none;
  align-items:center; justify-content:center; padding:20px; z-index:30; cursor:zoom-out;
}
.lb.open{display:flex}
.lb img{max-width:min(92vw,640px); max-height:86vh; border-radius:20px; background:#fff}
button:focus-visible,.pic:focus-visible{outline:3px solid #b9a6dd; outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Обираємо нову аватарку 🎃</h1>
    <p>Познач зірочкою до трьох робіт, які тобі сподобались. Передумав — натисни ще раз, і голос зніметься.</p>
  </header>

  <div id="demo" class="demo" hidden>Демо-режим: голоси зберігаються лише в цьому браузері. Підключи Firebase, щоб усі бачили спільний результат.</div>

  <div class="bar">
    <div class="left">
      <div class="dots" id="dots"></div>
      <span id="left"></span>
    </div>
    <div class="leader" id="leader"></div>
    <button class="sort" id="sort">Сортувати за зірочками</button>
  </div>

  <div id="msg" class="msg">Завантажуємо картинки…</div>
  <div id="grid" class="grid"></div>
</div>

<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>

<script type="module">
/* ============ НАЛАШТУВАННЯ ============ */
const MAX_VOTES = 3;            // скільки голосів має кожен учень
const FOLDER = "img";           // папка з картинками: img/1.png, img/2.png ...

// Встав сюди конфіг із Firebase (Project settings → Your apps → Web app).
// Поки projectId порожній, сайт працює в демо-режимі.
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
/* ====================================== */

const $ = id => document.getElementById(id);
const cloud = !!firebaseConfig.projectId;
const MINE_KEY = "avatarVotes";
const DEMO_KEY = "avatarDemoCounts";

let total = 0;
let counts = {};                       // id -> кількість голосів
let mine = new Set(JSON.parse(safeGet(MINE_KEY) || "[]").map(Number));
let sortByVotes = false;
const cards = {};                      // id -> {el, cnt, btn, crown}

function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* --- скільки є картинок: пробуємо 1.png, 2.png ... доки не буде помилки --- */
function probe(n){
  return new Promise(res=>{
    const im = new Image();
    im.onload = () => res(true);
    im.onerror = () => res(false);
    im.src = `${FOLDER}/${n}.png`;
  });
}
async function countImages(){
  let n = 0;
  while (await probe(n+1)) n++;
  return n;
}

/* --- сховище голосів --- */
let store;
if (cloud){
  const V = "10.14.1";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  store = {
    listen(cb){
      fs.onSnapshot(fs.collection(db,"votes"), snap=>{
        const c = {};
        snap.forEach(d => c[d.id] = Math.max(0, d.data().votes || 0));
        cb(c);
      }, err => { console.error(err); toast("Не вдалося з’єднатися з сервером"); });
    },
    change(id, delta){
      return fs.setDoc(fs.doc(db,"votes",String(id)), { votes: fs.increment(delta) }, { merge:true });
    }
  };
} else {
  $("demo").hidden = false;
  let cb = ()=>{};
  const load = () => { try{ return JSON.parse(safeGet(DEMO_KEY) || "{}"); }catch(e){ return {}; } };
  store = {
    listen(f){ cb = f; f(load()); },
    change(id, delta){
      const c = load();
      c[id] = Math.max(0, (c[id]||0) + delta);
      safeSet(DEMO_KEY, JSON.stringify(c));
      cb(c);
      return Promise.resolve();
    }
  };
}

/* --- інтерфейс --- */
function build(){
  const grid = $("grid");
  for (let i=1; i<=total; i++){
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="pic" tabindex="0" role="button" aria-label="Збільшити аватарку ${i}">
        <img src="${FOLDER}/${i}.png" alt="Аватарка ${i}" loading="lazy">
      </div>
      <div class="row">
        <div><div class="name">№ ${i}<span class="crown" hidden>👑</span></div><div class="count"></div></div>
        <button class="star" aria-pressed="false" aria-label="Голос за аватарку ${i}">★<span>Голос</span></button>
      </div>`;
    const pic = el.querySelector(".pic");
    const open = () => { $("lbimg").src = `${FOLDER}/${i}.png`; $("lb").classList.add("open"); };
    pic.addEventListener("click", open);
    pic.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
    const btn = el.querySelector(".star");
    btn.addEventListener("click", () => toggle(i));
    cards[i] = { el, cnt: el.querySelector(".count"), btn, crown: el.querySelector(".crown") };
    grid.appendChild(el);
  }
  const dots = $("dots");
  for (let k=0; k<MAX_VOTES; k++){ const d = document.createElement("span"); d.className="dot"; dots.appendChild(d); }
}

function render(){
  const vals = Object.keys(cards).map(i => counts[i] || 0);
  const top = Math.max(0, ...vals);
  for (const i in cards){
    const c = cards[i], v = counts[i] || 0, on = mine.has(+i);
    c.cnt.textContent = v + " " + plural(v);
    c.el.classList.toggle("mine", on);
    c.btn.classList.toggle("on", on);
    c.btn.setAttribute("aria-pressed", on);
    c.btn.firstElementChild.textContent = on ? "Мій голос" : "Голос";
    c.crown.hidden = !(top > 0 && v === top);
  }
  const used = mine.size;
  [...$("dots").children].forEach((d,k)=> d.classList.toggle("on", k < MAX_VOTES-used));
  $("left").textContent = used >= MAX_VOTES ? "Голоси використано" : `Залишилось голосів: ${MAX_VOTES-used}`;

  const leaders = Object.keys(cards).filter(i => top>0 && (counts[i]||0)===top);
  $("leader").innerHTML = leaders.length
    ? `Лідирує: <b>${leaders.map(i=>"№ "+i).join(", ")}</b> (${top} ${plural(top)})`
    : "Голосів ще немає";

  const order = Object.keys(cards).map(Number);
  if (sortByVotes) order.sort((a,b)=> (counts[b]||0)-(counts[a]||0) || a-b);
  order.forEach(i => $("grid").appendChild(cards[i].el));
}

function plural(n){
  const a = n % 10, b = n % 100;
  if (a===1 && b!==11) return "зірочка";
  if (a>=2 && a<=4 && (b<12 || b>14)) return "зірочки";
  return "зірочок";
}

async function toggle(id){
  const on = mine.has(id);
  if (!on && mine.size >= MAX_VOTES){
    toast(`Усі ${MAX_VOTES} голоси вже використано. Зніми один, щоб обрати іншу.`);
    return;
  }
  on ? mine.delete(id) : mine.add(id);
  safeSet(MINE_KEY, JSON.stringify([...mine]));
  render();
  try{ await store.change(id, on ? -1 : 1); }
  catch(e){
    console.error(e);
    on ? mine.add(id) : mine.delete(id);
    safeSet(MINE_KEY, JSON.stringify([...mine]));
    render();
    toast("Не вдалося зберегти голос. Спробуй ще раз.");
  }
}

let tt;
function toast(t){
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("show"), 2800);
}

$("sort").addEventListener("click", () => {
  sortByVotes = !sortByVotes;
  $("sort").textContent = sortByVotes ? "Показати за номерами" : "Сортувати за зірочками";
  render();
});
$("lb").addEventListener("click", () => $("lb").classList.remove("open"));
document.addEventListener("keydown", e => { if (e.key==="Escape") $("lb").classList.remove("open"); });

/* --- старт --- */
total = await countImages();
if (!total){
  $("msg").textContent = "Картинок не знайдено. Поклади файли 1.png, 2.png… у папку img.";
} else {
  $("msg").remove();
  build();
  store.listen(c => { counts = c; render(); });
}
</script>
</body>
</html>
